<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/_sdk/glyx-sdk.css">
<style>
  .phase{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  .phase.break{color:var(--ok)}
  .time{margin:4px 0 8px;font-size:44px;font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .bar{height:3px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s linear}
  .break + .time + .bar i{background:var(--ok)}
  .row{display:flex;align-items:center;gap:8px;margin-top:12px}
  .row button{padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:12.5px;cursor:pointer}
  .row button:hover{border-color:var(--accent)}
  .row button.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .dots{margin-left:auto;display:flex;gap:4px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-2)}
  .dots i.on{background:var(--accent)}
</style>
</head>
<body>
<div class="phase" id="phase">Focus</div>
<div class="time" id="time">25:00</div>
<div class="bar"><i id="bar"></i></div>
<div class="row">
  <button class="go" id="go">Start</button>
  <button id="skip">Skip</button>
  <button id="reset">Reset</button>
  <div class="dots" id="dots"></div>
</div>
<script src="/_sdk/glyx-sdk.js"></script>
<script src="main.js"></script>
</body>
</html>
