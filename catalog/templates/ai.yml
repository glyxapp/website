# Glyx template "AI desk" from glyx.org/templates
# For a day spent with coding agents, on the Neon skin. Four tall gauges across the top: how much
# of your Claude and ChatGPT quota is left and when it resets, whether Claude, OpenAI and GitHub
# are up, and how hard the machine is working. Under them the AI news worth reading, new releases of the tools
# you run, and the prompts you keep.
theme: { skin: neon }
label:
  tray: glyx.claude-usage
  pills: [glyx.claude-usage, glyx.chatgpt-usage]
pages:
  - name: Agents
    mode: fit
    widgets:
      - plugin: glyx.claude-usage
        x: 0
        y: 0
        cols: 6
        rows: 8
      - plugin: glyx.chatgpt-usage
        x: 6
        y: 0
        cols: 6
        rows: 8
      - plugin: glyx.status
        x: 12
        y: 0
        cols: 6
        rows: 8
        config: { services: [claude, openai, github, npm] }
      - plugin: glyx.system
        variant: graph
        x: 18
        y: 0
        cols: 6
        rows: 8
      - plugin: glyx.rss
        title: AI news
        variant: headlines
        x: 0
        y: 8
        cols: 12
        rows: 8
        config:
          limit: 25
          feeds:
            - https://simonwillison.net/atom/everything/
            - https://huggingface.co/blog/feed.xml
            - https://openai.com/news/rss.xml
      - plugin: glyx.releases
        title: Tools
        x: 12
        y: 8
        cols: 6
        rows: 8
        config: { repos: [anthropics/claude-code, openai/codex, ollama/ollama, ggml-org/llama.cpp, vllm-project/vllm] }
      - plugin: glyx.notes
        title: Prompts
        x: 18
        y: 8
        cols: 6
        rows: 8
        config: { name: prompts, mono: true }
