# Glyx template "Developer desk" from glyx.org/templates
# Two pages, each exactly one screen on the 24-cell grid: what is new in your tools, then a page
# for focused work. Put your own repos, services and links in each widget's settings.
theme: { preset: dark, accent: "#7aa2f7" }
label:
  tray: glyx.claude-usage
  pills: [glyx.claude-usage, glyx.system#cpu]
pages:
  - name: Code
    mode: fit
    widgets:
      # Left: the time, your AI quota and the machine.
      - plugin: glyx.clock
        x: 0
        y: 0
        cols: 6
        rows: 4
        config: { zones: [{ label: UTC, tz: Etc/UTC }, { label: San Francisco, tz: America/Los_Angeles }] }
      - plugin: glyx.claude-usage
        x: 0
        y: 4
        cols: 6
        rows: 4
      - plugin: glyx.chatgpt-usage
        x: 0
        y: 8
        cols: 6
        rows: 4
      - plugin: glyx.system
        x: 0
        y: 12
        cols: 6
        rows: 4
      # Middle: what to read.
      - plugin: glyx.hackernews
        x: 6
        y: 0
        cols: 12
        rows: 8
        config: { limit: 20 }
      - plugin: glyx.rss
        title: Developer blogs
        variant: headlines
        x: 6
        y: 8
        cols: 12
        rows: 8
        config:
          limit: 20
          feeds:
            - https://github.blog/feed/
            - https://blog.rust-lang.org/feed.xml
            - https://devblogs.microsoft.com/typescript/feed/
            - https://simonwillison.net/atom/everything/
      # Right: your tools and the services they depend on.
      - plugin: glyx.releases
        x: 18
        y: 0
        cols: 6
        rows: 8
        config: { repos: [anthropics/claude-code, microsoft/vscode, nodejs/node, tauri-apps/tauri, rust-lang/rust] }
      - plugin: glyx.monitor
        title: Services
        x: 18
        y: 8
        cols: 6
        rows: 4
        config:
          targets:
            - { name: GitHub, url: "https://github.com" }
            - { name: npm, url: "https://registry.npmjs.org" }
            - { name: Cloudflare, url: "https://www.cloudflare.com" }
      - plugin: glyx.todo
        x: 18
        y: 12
        cols: 6
        rows: 4

  - name: Focus
    mode: fit
    widgets:
      - plugin: glyx.timer
        variant: pomodoro
        x: 0
        y: 0
        cols: 6
        rows: 8
        config: { focus: 50, shortBreak: 10, longBreak: 20, longEvery: 3, dailyGoal: 5 }
      - plugin: glyx.keys
        variant: week
        x: 0
        y: 8
        cols: 6
        rows: 8
        config: { metric: both }
      - plugin: glyx.notes
        title: Scratchpad
        x: 6
        y: 0
        cols: 12
        rows: 8
        config: { name: scratch, mono: true }
      - plugin: glyx.bookmarks
        variant: grid
        x: 6
        y: 8
        cols: 12
        rows: 8
        config:
          links:
            - { title: GitHub, url: "https://github.com", group: Code }
            - { title: Claude, url: "https://claude.ai", group: Code }
            - { title: MDN, url: "https://developer.mozilla.org", group: Docs }
            - { title: DevDocs, url: "https://devdocs.io", group: Docs }
            - { title: Can I use, url: "https://caniuse.com", group: Docs }
            - { title: regex101, url: "https://regex101.com", group: Tools }
            - { title: crontab.guru, url: "https://crontab.guru", group: Tools }
            - { title: Excalidraw, url: "https://excalidraw.com", group: Tools }
      - plugin: glyx.calendar
        x: 18
        y: 0
        cols: 6
        rows: 8
        config: { weekNumbers: true }
      - plugin: glyx.network
        x: 18
        y: 8
        cols: 6
        rows: 4
      - plugin: glyx.media
        x: 18
        y: 12
        cols: 6
        rows: 4
