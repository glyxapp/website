# Glyx template "Developer desk" from glyx.org/templates
# The first page is an instrument panel, read top to bottom: four gauges across the top (Claude
# and ChatGPT quota, whether the services you build on are up, the machine), then the work itself:
# a scratchpad, today's tasks and new releases of your tools, and a 50/10 timer beside the week.
# Reading waits on the second page: Hacker News and a few good blogs, with your links as tiles.
theme: { preset: dark, accent: "#7aa2f7" }
label:
  tray: glyx.claude-usage
  pills: [glyx.claude-usage, glyx.status]
pages:
  - name: Work
    mode: fit
    widgets:
      # The gauges: four of the same size, one glance.
      - plugin: glyx.claude-usage
        x: 0
        y: 0
        cols: 6
        rows: 4
      - plugin: glyx.chatgpt-usage
        x: 6
        y: 0
        cols: 6
        rows: 4
      - plugin: glyx.status
        x: 12
        y: 0
        cols: 6
        rows: 4
        config: { services: [claude, openai, github, npm, cloudflare, vercel] }
      - plugin: glyx.system
        variant: bars
        x: 18
        y: 0
        cols: 6
        rows: 4
      # The work.
      - plugin: glyx.notes
        title: Scratchpad
        x: 0
        y: 4
        cols: 12
        rows: 8
        config: { name: scratch, mono: true }
      - plugin: glyx.todo
        title: Today
        x: 12
        y: 4
        cols: 6
        rows: 8
        config: { list: dev }
      - plugin: glyx.releases
        x: 18
        y: 4
        cols: 6
        rows: 8
        config: { repos: [anthropics/claude-code, microsoft/vscode, nodejs/node, tauri-apps/tauri, rust-lang/rust] }
      - plugin: glyx.timer
        variant: pomodoro
        x: 0
        y: 12
        cols: 12
        rows: 4
        style: { background: tinted }
        config: { focus: 50, shortBreak: 10, longBreak: 20, longEvery: 3, dailyGoal: 5 }
      - plugin: glyx.calendar
        variant: week
        x: 12
        y: 12
        cols: 12
        rows: 4
        style: { header: false }

  - name: Read
    mode: fit
    widgets:
      - plugin: glyx.hackernews
        x: 0
        y: 0
        cols: 12
        rows: 16
        config: { limit: 30 }
      - plugin: glyx.rss
        title: Blogs
        variant: headlines
        x: 12
        y: 0
        cols: 12
        rows: 8
        config:
          limit: 25
          feeds:
            - https://simonwillison.net/atom/everything/
            - https://github.blog/feed/
            - https://lobste.rs/rss
            - https://blog.rust-lang.org/feed.xml
      - plugin: glyx.bookmarks
        variant: grid
        x: 12
        y: 8
        cols: 12
        rows: 8
        style: { header: false }
        config:
          links:
            - { title: GitHub, url: "https://github.com", group: Code }
            - { title: Claude, url: "https://claude.ai", group: Code }
            - { title: MDN, url: "https://developer.mozilla.org", group: Docs }
            - { title: DevDocs, url: "https://devdocs.io", group: Docs }
            - { title: Can I use, url: "https://caniuse.com", group: Docs }
            - { title: regex101, url: "https://regex101.com", group: Tools }
            - { title: crontab.guru, url: "https://crontab.guru", group: Tools }
            - { title: Excalidraw, url: "https://excalidraw.com", group: Tools }
