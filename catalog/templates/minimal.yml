# Glyx template "Minimal desk" from glyx.org/templates
# Four quiet cards pinned to the desktop, under your other windows. No headers: the time, the
# weather and the date speak for themselves.
theme: { preset: system }
window: { mode: widget }
pages:
  - name: Desk
    widgets:
      - plugin: glyx.clock
        variant: analog
        x: 0
        y: 0
        cols: 6
        rows: 8
        style: { header: false }
        config: { zones: [] }
      - plugin: glyx.weather
        x: 6
        y: 0
        cols: 6
        rows: 4
        style: { header: false }
        config: { location: Hanoi }
      - plugin: glyx.calendar
        variant: day
        x: 6
        y: 4
        cols: 6
        rows: 4
        style: { header: false }
        config: { lunar: true, upcoming: 1, events: [{ date: "L 01-01", label: Tết Nguyên Đán }] }
      - plugin: glyx.todo
        x: 0
        y: 8
        cols: 12
        rows: 4
