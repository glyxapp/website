# Glyx template "Study desk" from glyx.org/templates
# Everything on it is for learning, nothing for passing the time. Today's word is the large card
# where the eye lands; beside it the pomodoro (tinted, the one thing that asks for attention) and
# your study habits with their streaks. Under them your notes, your homework and a quiz on the
# words you have seen. All in the soft Mochi skin.
theme: { skin: mochi, preset: system }
label:
  pills: [glyx.timer, glyx.habits]
pages:
  - name: Study
    mode: fit
    widgets:
      - plugin: glyx.vocab
        variant: card
        x: 0
        y: 0
        cols: 12
        rows: 8
        config: { language: en, cefr: a2 }
      - plugin: glyx.timer
        variant: pomodoro
        x: 12
        y: 0
        cols: 6
        rows: 8
        style: { background: tinted }
        config: { focus: 25, shortBreak: 5, longBreak: 15, dailyGoal: 8 }
      - plugin: glyx.habits
        title: Every day
        x: 18
        y: 0
        cols: 6
        rows: 8
        config: { list: study }
      - plugin: glyx.notes
        x: 0
        y: 8
        cols: 12
        rows: 8
        config: { name: study }
      - plugin: glyx.todo
        title: Homework
        x: 12
        y: 8
        cols: 6
        rows: 8
        config: { list: study }
      - plugin: glyx.vocab
        title: Quiz
        variant: quiz
        x: 18
        y: 8
        cols: 6
        rows: 8
        config: { language: en, cefr: a2 }
