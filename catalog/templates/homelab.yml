# Glyx template "Home lab" from glyx.org/templates
# On the green Phosphor terminal skin. Your services and the box itself share the top: uptime
# checks on the left, CPU and the network as two scope traces on the right. Below them, new
# releases of the apps you self-host, the cloud you depend on (Cloudflare, GitHub, Docker Hub) and
# a runbook. Put your own servers in Services: LAN addresses such as http://192.168.1.2:8123 work.
theme: { skin: phosphor }
label:
  tray: glyx.monitor
  pills: [glyx.system#cpu, glyx.network]
pages:
  - name: Ops
    mode: fit
    widgets:
      - plugin: glyx.monitor
        title: Services
        x: 0
        y: 0
        cols: 12
        rows: 8
        config:
          targets:
            - { name: Cloudflare DNS, url: "https://1.1.1.1" }
            - { name: Docker Hub, url: "https://hub.docker.com" }
            - { name: Tailscale, url: "https://login.tailscale.com" }
            - { name: GitHub, url: "https://github.com" }
      - plugin: glyx.system
        variant: graph
        x: 12
        y: 0
        cols: 12
        rows: 4
        style: { header: false }
      - plugin: glyx.network
        x: 12
        y: 4
        cols: 12
        rows: 4
        style: { header: false }
      - plugin: glyx.releases
        title: Self-hosted
        x: 0
        y: 8
        cols: 12
        rows: 8
        config:
          repos: [home-assistant/core, immich-app/immich, jellyfin/jellyfin, louislam/uptime-kuma, traefik/traefik, portainer/portainer]
      - plugin: glyx.status
        title: Upstream
        x: 12
        y: 8
        cols: 6
        rows: 8
        config: { services: [cloudflare, github, docker, digitalocean] }
      - plugin: glyx.notes
        title: Runbook
        x: 18
        y: 8
        cols: 6
        rows: 8
        config: { name: runbook, mono: true }
